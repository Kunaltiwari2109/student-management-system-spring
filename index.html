<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Records — Ridgeway</title>
    <meta
      name="description"
      content="Manage student records, marks, and academic status from one dashboard."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script
      crossorigin
      src="https://unpkg.com/react@18/umd/react.production.min.js"
    ></script>
    <script
      crossorigin
      src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      :root {
        --paper: #f4f0e6;
        --ink: #1c2318;
        --moss: #2e3b26;
        --gold: #c9a227;
        --line: #d8d2c0;
        --card: #fbf9f2;
        --muted: #6b7261;
        --destructive: #a4372a;
        --accent: #ece7d6;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family: "Space Grotesk", system-ui, sans-serif;
        background: var(--paper);
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
      }
      .font-display {
        font-family: "Anton", "Space Grotesk", sans-serif;
        letter-spacing: 0.02em;
      }

      .layout {
        display: flex;
        min-height: 100vh;
      }

      /* Sidebar */
      .sidebar {
        width: 210px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        background: var(--moss);
        padding: 24px 20px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 40px;
      }
      .brand-badge {
        width: 32px;
        height: 32px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: var(--gold);
        color: var(--moss);
        font-family: "Anton", sans-serif;
        font-size: 18px;
      }
      .brand-name {
        font-family: "Anton", sans-serif;
        font-size: 15px;
        text-transform: uppercase;
        color: var(--paper);
      }
      .nav {
        display: flex;
        flex-direction: column;
        gap: 4px;
        font-size: 13px;
        font-weight: 500;
        color: rgba(244, 240, 230, 0.6);
      }
      .nav-item {
        display: flex;
        align-items: center;
        gap: 10px;
        border-radius: 6px;
        padding: 8px 12px;
        cursor: pointer;
      }
      .nav-item:hover {
        background: rgba(244, 240, 230, 0.05);
      }
      .nav-item.active {
        background: rgba(201, 162, 39, 0.15);
        color: var(--gold);
      }
      .sidebar-card {
        margin-top: auto;
        border-radius: 8px;
        background: rgba(244, 240, 230, 0.05);
        padding: 16px;
      }
      .sidebar-card .label {
        font-size: 10px;
        text-transform: uppercase;
        color: rgba(244, 240, 230, 0.45);
      }
      .sidebar-card .count {
        margin-top: 4px;
        font-size: 22px;
        font-weight: 600;
        color: var(--paper);
      }
      .sidebar-card .note {
        margin-top: 4px;
        font-size: 11px;
        color: rgba(244, 240, 230, 0.4);
      }

      /* Main */
      .main {
        min-width: 0;
        flex: 1;
      }
      .hero {
        background: var(--moss);
        padding: 32px 40px;
        overflow: hidden;
      }
      .hero-inner {
        max-width: 1200px;
        margin: 0 auto;
      }
      .hero-eyebrow {
        font-size: 11px;
        text-transform: uppercase;
        color: var(--gold);
        letter-spacing: 0.12em;
      }
      .hero-title {
        margin-top: 4px;
        font-family: "Anton", sans-serif;
        font-size: 58px;
        line-height: 1;
        text-transform: uppercase;
        color: var(--paper);
      }
      .hero-pill {
        margin-top: 16px;
        display: inline-flex;
        align-items: center;
        gap: 8px;
        border-radius: 999px;
        border: 1px solid rgba(244, 240, 230, 0.1);
        padding: 4px 12px;
        font-size: 12px;
        color: rgba(244, 240, 230, 0.65);
      }
      .hero-pill .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--gold);
      }

      .content {
        max-width: 1200px;
        margin: 0 auto;
        padding: 28px 40px;
      }

      /* Metrics */
      .metrics {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1px;
        overflow: hidden;
        border-radius: 8px;
        background: var(--line);
        border: 1px solid var(--line);
        animation: ledger-rise 0.5s ease both;
      }
      @keyframes ledger-rise {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .metric {
        background: var(--card);
        padding: 20px;
      }
      .metric .label {
        font-size: 10px;
        text-transform: uppercase;
        color: var(--muted);
        letter-spacing: 0.08em;
      }
      .metric .value {
        margin-top: 4px;
        font-family: "Anton", sans-serif;
        font-size: 30px;
      }
      .metric .note {
        margin-top: 4px;
        font-size: 11px;
        color: var(--muted);
      }

      /* Toolbar */
      .toolbar {
        margin-top: 24px;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .search-wrap {
        position: relative;
        flex: 1;
        min-width: 240px;
      }
      .search-wrap svg {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
      }
      input,
      select {
        height: 36px;
        border-radius: 6px;
        border: 1px solid var(--line);
        background: var(--card);
        padding: 0 12px;
        font-size: 13px;
        font-family: inherit;
        color: var(--ink);
        outline: none;
      }
      input:focus,
      select:focus {
        box-shadow: 0 0 0 2px rgba(201, 162, 39, 0.45);
      }
      .search-wrap input {
        width: 100%;
        padding-left: 36px;
      }
      .sort-wrap {
        position: relative;
      }
      .sort-wrap svg {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--muted);
        pointer-events: none;
      }
      .sort-wrap select {
        padding-left: 32px;
      }

      /* Buttons */
      .btn {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        height: 36px;
        border-radius: 6px;
        border: 1px solid transparent;
        padding: 0 14px;
        font-size: 13px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        background: var(--moss);
        color: var(--paper);
      }
      .btn:hover {
        filter: brightness(1.08);
      }
      .btn-secondary {
        background: transparent;
        color: var(--ink);
        border-color: var(--line);
      }
      .btn-danger {
        background: var(--destructive);
        color: #fff;
      }
      .btn-ghost {
        background: transparent;
        color: var(--ink);
      }
      .btn-ghost:hover {
        background: var(--accent);
        filter: none;
      }
      .btn-icon {
        width: 36px;
        padding: 0;
        justify-content: center;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .text-destructive {
        color: var(--destructive);
      }

      /* Table */
      .table-card {
        margin-top: 20px;
        overflow-x: auto;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--card);
      }
      table {
        width: 100%;
        min-width: 620px;
        font-size: 13px;
        border-collapse: collapse;
      }
      thead {
        background: var(--moss);
        font-size: 10px;
        text-transform: uppercase;
        color: rgba(244, 240, 230, 0.7);
        letter-spacing: 0.08em;
      }
      th {
        padding: 12px 16px;
        text-align: left;
        font-weight: 500;
      }
      th:last-child {
        text-align: right;
      }
      td {
        padding: 12px 16px;
        border-bottom: 1px solid var(--line);
      }
      tbody tr:last-child td {
        border-bottom: 0;
      }
      tbody tr:hover {
        background: rgba(236, 231, 214, 0.5);
      }
      .td-id {
        font-weight: 500;
        color: var(--muted);
      }
      .td-name {
        font-weight: 600;
      }
      .td-marks {
        font-family: "Anton", sans-serif;
        font-size: 18px;
      }
      .badge {
        border-radius: 4px;
        padding: 2px 8px;
        font-size: 10px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.06em;
      }
      .badge-pass {
        background: rgba(201, 162, 39, 0.15);
        color: var(--ink);
      }
      .badge-risk {
        background: rgba(164, 55, 42, 0.1);
        color: var(--destructive);
      }
      .row-actions {
        display: flex;
        justify-content: flex-end;
        gap: 4px;
      }
      .empty {
        padding: 56px 20px;
        text-align: center;
      }
      .empty p {
        margin-top: 12px;
        font-weight: 500;
      }
      .empty .hint {
        margin-top: 4px;
        font-size: 12px;
        color: var(--muted);
        font-weight: 400;
      }

      .table-footer {
        margin-top: 16px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        font-size: 12px;
        color: var(--muted);
      }
      .pager {
        display: flex;
        gap: 4px;
      }

      /* Modal */
      .overlay {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-items: center;
        background: rgba(46, 59, 38, 0.7);
        padding: 16px;
      }
      .modal {
        width: 100%;
        max-width: 512px;
        border-radius: 8px;
        background: var(--card);
        padding: 24px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
      }
      .modal-sm {
        max-width: 448px;
      }
      .modal-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
      }
      .modal-eyebrow {
        font-size: 10px;
        text-transform: uppercase;
        color: var(--muted);
        letter-spacing: 0.08em;
      }
      .modal-title {
        margin-top: 4px;
        font-family: "Anton", sans-serif;
        font-size: 30px;
        text-transform: uppercase;
      }
      .form-grid {
        margin-top: 24px;
        display: grid;
        gap: 16px;
        grid-template-columns: 1fr 1fr;
      }
      .field {
        font-size: 12px;
        font-weight: 500;
        color: var(--muted);
      }
      .field input {
        margin-top: 4px;
        width: 100%;
        height: 40px;
        font-size: 14px;
      }
      .field input:disabled {
        opacity: 0.55;
      }
      .modal-actions {
        margin-top: 24px;
        display: flex;
        justify-content: flex-end;
        gap: 8px;
      }
      .delete-icon {
        width: 40px;
        height: 40px;
        display: grid;
        place-items: center;
        border-radius: 50%;
        background: rgba(164, 55, 42, 0.1);
        color: var(--destructive);
      }
      .delete-text {
        margin-top: 8px;
        font-size: 14px;
        color: var(--muted);
      }
      .delete-text strong {
        color: var(--ink);
      }

      /* Mobile */
      .mobile-topbar {
        display: none;
      }
      .menu-btn {
        display: none;
      }
      @media (max-width: 1024px) {
        .sidebar {
          display: none;
          position: fixed;
          inset: 0 auto 0 0;
          z-index: 40;
          box-shadow: 0 25px 50px rgba(0, 0, 0, 0.35);
        }
        .sidebar.open {
          display: flex;
        }
        .menu-btn {
          display: inline-flex;
        }
        .mobile-topbar {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-bottom: 20px;
          color: var(--paper);
        }
        .hero {
          padding: 24px 20px;
        }
        .hero-title {
          font-size: 42px;
        }
        .content {
          padding: 24px 20px;
        }
        .metrics {
          grid-template-columns: 1fr 1fr;
        }
        .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script id="dashboard-source" type="text/plain">
      const { useEffect, useMemo, useState } = React;
      const API_BASE_URL = "https://student-management-system-spring-2.onrender.com";

      async function apiRequest(path, options = {}) {
        const response = await fetch(API_BASE_URL + path, {
          ...options,
          headers: { "Content-Type": "application/json", ...options.headers },
        });
        const body = await response.text();
        if (!response.ok)
          throw new Error(body || `Request failed (${response.status})`);
        const contentType = response.headers.get("content-type") || "";
        return body && contentType.includes("application/json")
          ? JSON.parse(body)
          : body || null;
      }

      /* ---------- Inline SVG icons (lucene-style) ---------- */
      const Icon = ({ children, size = 16 }) => (
        <svg
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
        >
          {children}
        </svg>
      );
      const SearchIcon = (p) => (
        <Icon {...p}>
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </Icon>
      );
      const PlusIcon = (p) => (
        <Icon {...p}>
          <path d="M5 12h14" />
          <path d="M12 5v14" />
        </Icon>
      );
      const PencilIcon = (p) => (
        <Icon {...p}>
          <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
          <path d="m15 5 4 4" />
        </Icon>
      );
      const TrashIcon = (p) => (
        <Icon {...p}>
          <path d="M3 6h18" />
          <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
          <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
        </Icon>
      );
      const XIcon = (p) => (
        <Icon {...p}>
          <path d="M18 6 6 18" />
          <path d="m6 6 12 12" />
        </Icon>
      );
      const MenuIcon = (p) => (
        <Icon {...p}>
          <path d="M4 12h16" />
          <path d="M4 6h16" />
          <path d="M4 18h16" />
        </Icon>
      );
      const SortIcon = (p) => (
        <Icon {...p}>
          <path d="m21 16-4 4-4-4" />
          <path d="M17 20V4" />
          <path d="m3 8 4-4 4 4" />
          <path d="M7 4v16" />
        </Icon>
      );
      const ChevronLeft = (p) => (
        <Icon {...p}>
          <path d="m15 18-6-6 6-6" />
        </Icon>
      );
      const ChevronRight = (p) => (
        <Icon {...p}>
          <path d="m9 18 6-6-6-6" />
        </Icon>
      );
      const DashboardIcon = (p) => (
        <Icon {...p}>
          <rect width="7" height="9" x="3" y="3" rx="1" />
          <rect width="7" height="5" x="14" y="3" rx="1" />
          <rect width="7" height="9" x="14" y="12" rx="1" />
          <rect width="7" height="5" x="3" y="16" rx="1" />
        </Icon>
      );
      const UsersIcon = (p) => (
        <Icon {...p}>
          <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
          <circle cx="9" cy="7" r="4" />
          <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
          <path d="M16 3.13a4 4 0 0 1 0 7.75" />
        </Icon>
      );
      const BookIcon = (p) => (
        <Icon {...p}>
          <path d="M12 7v14" />
          <path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z" />
        </Icon>
      );
      const CapIcon = (p) => (
        <Icon {...p}>
          <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z" />
          <path d="M22 10v6" />
          <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5" />
        </Icon>
      );

      /* ---------- Data ---------- */
      const emptyStudent = { name: "", marks: 0 };

      /* ---------- Small components ---------- */
      function NavItem({ icon, label, active }) {
        return (
          <div className={"nav-item" + (active ? " active" : "")}>
            {icon}
            {label}
          </div>
        );
      }

      function Metric({ label, value, note }) {
        return (
          <div className="metric">
            <div className="label">{label}</div>
            <div className="value">{value}</div>
            <div className="note">{note}</div>
          </div>
        );
      }

      function StudentRow({ student, onEdit, onDelete }) {
        const status =
          student.marks >= 80
            ? "Excellent"
            : student.marks >= 60
              ? "Pass"
              : "At risk";
        return (
          <tr>
            <td className="td-id">{student.id}</td>
            <td className="td-name">{student.name}</td>
            <td className="td-marks">{student.marks}</td>
            <td>
              <span
                className={
                  "badge " + (student.marks >= 60 ? "badge-pass" : "badge-risk")
                }
              >
                {status}
              </span>
            </td>
            <td>
              <div className="row-actions">
                <button
                  className="btn btn-ghost btn-icon"
                  aria-label={"Edit " + student.name}
                  title="Edit student"
                  onClick={onEdit}
                >
                  <PencilIcon size={14} />
                </button>
                <button
                  className="btn btn-ghost btn-icon text-destructive"
                  aria-label={"Delete " + student.name}
                  title="Delete student"
                  onClick={onDelete}
                >
                  <TrashIcon size={14} />
                </button>
              </div>
            </td>
          </tr>
        );
      }

      function Field({ label, children }) {
        return (
          <label className="field">
            {label}
            {children}
          </label>
        );
      }

      function StudentModal({ student, isNew, isSaving, onClose, onSave }) {
        const [form, setForm] = useState(student);
        function submit(e) {
          e.preventDefault();
          onSave({
            ...form,
            marks: Math.max(0, Math.min(100, Number(form.marks))),
          });
        }
        return (
          <div
            className="overlay"
            role="dialog"
            aria-modal="true"
            aria-labelledby="student-form-title"
          >
            <form onSubmit={submit} className="modal">
              <div className="modal-head">
                <div>
                  <div className="modal-eyebrow">Student record</div>
                  <h2 id="student-form-title" className="modal-title">
                    {isNew ? "Add student" : "Edit student"}
                  </h2>
                </div>
                <button
                  type="button"
                  className="btn btn-ghost btn-icon"
                  aria-label="Close form"
                  onClick={onClose}
                >
                  <XIcon />
                </button>
              </div>
              <div className="form-grid">
                <Field label="Full name">
                  <input
                    required
                    value={form.name}
                    onChange={(e) => setForm({ ...form, name: e.target.value })}
                  />
                </Field>
                <Field label="Marks (0–100)">
                  <input
                    required
                    type="number"
                    min="0"
                    max="100"
                    value={form.marks}
                    onChange={(e) =>
                      setForm({ ...form, marks: Number(e.target.value) })
                    }
                  />
                </Field>
              </div>
              <div className="modal-actions">
                <button
                  type="button"
                  className="btn btn-secondary"
                  onClick={onClose}
                >
                  Cancel
                </button>
                <button type="submit" className="btn" disabled={isSaving}>
                  {isNew ? "Add record" : "Save changes"}
                </button>
              </div>
            </form>
          </div>
        );
      }

      function DeleteModal({ student, onClose, onConfirm }) {
        return (
          <div
            className="overlay"
            role="alertdialog"
            aria-modal="true"
            aria-labelledby="delete-title"
          >
            <div className="modal modal-sm">
              <div className="delete-icon">
                <TrashIcon size={20} />
              </div>
              <h2
                id="delete-title"
                className="modal-title"
                style={{ marginTop: 16, fontSize: 24 }}
              >
                Delete student?
              </h2>
              <p className="delete-text">
                Remove <strong>{student.name}</strong> ({student.id})? This
                action cannot be undone.
              </p>
              <div className="modal-actions">
                <button className="btn btn-secondary" onClick={onClose}>
                  Cancel
                </button>
                <button className="btn btn-danger" onClick={onConfirm}>
                  Delete record
                </button>
              </div>
            </div>
          </div>
        );
      }

      /* ---------- Dashboard ---------- */
      function StudentDashboard() {
        const [students, setStudents] = useState([]);
        const [isLoading, setIsLoading] = useState(true);
        const [isSaving, setIsSaving] = useState(false);
        const [apiError, setApiError] = useState("");
        const [search, setSearch] = useState("");
        const [marksFilter, setMarksFilter] = useState("all");
        const [sort, setSort] = useState("marks-desc");
        const [editing, setEditing] = useState(null);
        const [deleting, setDeleting] = useState(null);
        const [mobileNav, setMobileNav] = useState(false);

        useEffect(() => {
          let active = true;
          apiRequest("/students")
            .then((records) => {
              if (active) setStudents(records);
            })
            .catch((error) => {
              if (active)
                setApiError(`Could not load students: ${error.message}`);
            })
            .finally(() => {
              if (active) setIsLoading(false);
            });
          return () => {
            active = false;
          };
        }, []);

        const visibleStudents = useMemo(() => {
          const term = search.trim().toLowerCase();
          return students
            .filter(
              (s) =>
                !term ||
                String(s.id).toLowerCase().includes(term) ||
                s.name.toLowerCase().includes(term),
            )
            .filter(
              (s) =>
                marksFilter === "all" ||
                (marksFilter === "high" && s.marks >= 80) ||
                (marksFilter === "mid" && s.marks >= 60 && s.marks < 80) ||
                (marksFilter === "low" && s.marks < 60),
            )
            .sort((a, b) =>
              sort === "marks-asc"
                ? a.marks - b.marks
                : sort === "name"
                  ? a.name.localeCompare(b.name)
                  : b.marks - a.marks,
            );
        }, [students, search, marksFilter, sort]);

        const average = students.length
          ? (
              students.reduce((sum, s) => sum + s.marks, 0) / students.length
            ).toFixed(1)
          : "0";
        const passRate = students.length
          ? Math.round(
              (students.filter((s) => s.marks >= 60).length / students.length) *
                100,
            )
          : 0;

        async function saveStudent(student) {
          setIsSaving(true);
          setApiError("");
          try {
            const isUpdate = student.id != null;
            const savedStudent = await apiRequest(
              isUpdate ? `/students/${student.id}` : "/students",
              {
                method: isUpdate ? "PUT" : "POST",
                body: JSON.stringify({
                  name: student.name,
                  marks: student.marks,
                }),
              },
            );
            setStudents((current) =>
              isUpdate
                ? current.map((item) =>
                    item.id === savedStudent.id ? savedStudent : item,
                  )
                : [savedStudent, ...current],
            );
            setEditing(null);
          } catch (error) {
            setApiError(`Could not save student: ${error.message}`);
          } finally {
            setIsSaving(false);
          }
        }

        async function deleteStudent() {
          setApiError("");
          try {
            await apiRequest(`/students/${deleting.id}`, { method: "DELETE" });
            setStudents((current) =>
              current.filter((item) => item.id !== deleting.id),
            );
            setDeleting(null);
          } catch (error) {
            setApiError(`Could not delete student: ${error.message}`);
          }
        }

        return (
          <div className="layout">
            <aside className={"sidebar" + (mobileNav ? " open" : "")}>
              <div className="brand">
                <span className="brand-badge">R</span>
                <span className="brand-name">Ridgeway</span>
                <button
                  className="btn btn-ghost btn-icon menu-btn"
                  style={{ marginLeft: "auto", color: "var(--paper)" }}
                  aria-label="Close navigation"
                  onClick={() => setMobileNav(false)}
                >
                  <XIcon />
                </button>
              </div>
              <nav className="nav">
                <NavItem icon={<DashboardIcon />} label="Overview" active />
                <NavItem icon={<UsersIcon />} label="Students" />
                <NavItem icon={<BookIcon />} label="Marks" />
                <NavItem icon={<CapIcon />} label="Reports" />
              </nav>
              <div className="sidebar-card">
                <div className="label">Records loaded</div>
                <div className="count">{students.length}</div>
                <div className="note">Spring Boot student API</div>
              </div>
            </aside>

            <div className="main">
              <header className="hero">
                <div className="hero-inner">
                  <div className="mobile-topbar">
                    <div className="brand" style={{ marginBottom: 0 }}>
                      <span
                        className="brand-badge"
                        style={{ width: 28, height: 28 }}
                      >
                        R
                      </span>
                      <span className="brand-name">Ridgeway</span>
                    </div>
                    <button
                      className="btn btn-ghost btn-icon"
                      style={{ color: "var(--paper)" }}
                      aria-label="Open navigation"
                      onClick={() => setMobileNav(true)}
                    >
                      <MenuIcon size={20} />
                    </button>
                  </div>
                  <div className="hero-eyebrow">
                    Academic year 2026 · Marks ledger
                  </div>
                  <h1 className="hero-title">
                    Student
                    <br />
                    Records
                  </h1>
                  <div className="hero-pill">
                    <span className="dot" />
                    {students.length} enrolled · {passRate}% passing
                  </div>
                </div>
              </header>

              <main className="content">
                {apiError && (
                  <div className="notice notice-error" role="alert">
                    {apiError}
                  </div>
                )}
                <section className="metrics">
                  <Metric
                    label="Enrolled"
                    value={String(students.length)}
                    note="current records"
                  />
                  <Metric
                    label="Average marks"
                    value={average}
                    note="across all students"
                  />
                  <Metric
                    label="Pass rate"
                    value={passRate + "%"}
                    note={
                      students.filter((s) => s.marks < 60).length +
                      " need support"
                    }
                  />
                  <Metric
                    label="Top score"
                    value={String(Math.max(...students.map((s) => s.marks), 0))}
                    note="highest current mark"
                  />
                </section>

                <section aria-label="Student filters" className="toolbar">
                  <label className="search-wrap">
                    <SearchIcon />
                    <input
                      value={search}
                      onChange={(e) => setSearch(e.target.value)}
                      placeholder="Search by ID or student name"
                      aria-label="Search by ID or name"
                    />
                  </label>
                  <select
                    aria-label="Filter by marks"
                    value={marksFilter}
                    onChange={(e) => setMarksFilter(e.target.value)}
                  >
                    <option value="all">Marks: all</option>
                    <option value="high">80 and above</option>
                    <option value="mid">60–79</option>
                    <option value="low">Below 60</option>
                  </select>
                  <label className="sort-wrap">
                    <SortIcon size={14} />
                    <select
                      aria-label="Sort records"
                      value={sort}
                      onChange={(e) => setSort(e.target.value)}
                    >
                      <option value="marks-desc">Marks: high to low</option>
                      <option value="marks-asc">Marks: low to high</option>
                      <option value="name">Name: A to Z</option>
                    </select>
                  </label>
                  <button
                    className="btn"
                    onClick={() => {
                      setApiError("");
                      setEditing({ ...emptyStudent });
                    }}
                  >
                    <PlusIcon />
                    Add student
                  </button>
                </section>

                <section className="table-card">
                  <table>
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>Student</th>
                        <th>Marks</th>
                        <th>Status</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody>
                      {visibleStudents.map((student) => (
                        <StudentRow
                          key={student.id}
                          student={student}
                          onEdit={() => setEditing(student)}
                          onDelete={() => setDeleting(student)}
                        />
                      ))}
                    </tbody>
                  </table>
                  {isLoading && (
                    <div className="empty">
                      <p>Loading student records...</p>
                    </div>
                  )}
                  {!isLoading && !visibleStudents.length && (
                    <div className="empty">
                      <SearchIcon size={24} />
                      <p>
                        {students.length
                          ? "No student records found"
                          : "No students yet"}
                      </p>
                      <p className="hint">
                        Try another name, ID, or marks range.
                      </p>
                    </div>
                  )}
                </section>

                <div className="table-footer">
                  <span>
                    Showing {visibleStudents.length} of {students.length}{" "}
                    records
                  </span>
                  <div className="pager">
                    <button
                      className="btn btn-secondary btn-icon"
                      aria-label="Previous page"
                      disabled
                    >
                      <ChevronLeft />
                    </button>
                    <button
                      className="btn btn-secondary btn-icon"
                      aria-label="Next page"
                      disabled
                    >
                      <ChevronRight />
                    </button>
                  </div>
                </div>
              </main>
            </div>

            {editing && (
              <StudentModal
                student={editing}
                isNew={editing.id == null}
                isSaving={isSaving}
                onClose={() => setEditing(null)}
                onSave={saveStudent}
              />
            )}
            {deleting && (
              <DeleteModal
                student={deleting}
                onClose={() => setDeleting(null)}
                onConfirm={deleteStudent}
              />
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(
        <StudentDashboard />,
      );
    </script>
    <script>
      const dashboardSource =
        document.getElementById("dashboard-source").textContent;
      const dashboardCode = Babel.transform(dashboardSource, {
        presets: [["react", { runtime: "classic" }]],
      }).code;
      const dashboardScript = document.createElement("script");
      dashboardScript.textContent = dashboardCode;
      document.body.appendChild(dashboardScript);
    </script>
  </body>
</html>
